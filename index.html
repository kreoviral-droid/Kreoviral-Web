<style>
:root{
  --black:#050505;
  --off:#F5F1EA;
  --off-dim:rgba(245,241,234,.55);
  --off-faint:rgba(245,241,234,.4);
  --off-ghost:rgba(245,241,234,.15);
  --line:rgba(245,241,234,.12);
  --line-strong:rgba(245,241,234,.24);
  --purple:#8B2BE2;
  --purple-soft:#A855F7;
  --rojo:#C93A38;
  --verde:#4CAF7D;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  background:#050505!important;color:var(--off);
  font-family:var(--sans);font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html{scroll-behavior:smooth;scroll-padding-top:60px}
::selection{background:var(--purple);color:#fff}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}

body::after{
  content:"";position:fixed;inset:0;z-index:999;pointer-events:none;
  opacity:.035;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
}

::-webkit-scrollbar{width:5px;background:#050505}
::-webkit-scrollbar-thumb{background:rgba(245,241,234,.18);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(245,241,234,.35)}

.rv{opacity:1;transform:none}
body.js-ready .rv{opacity:0;transform:translateY(30px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
body.js-ready .rv.visible{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}
.rv.d2{transition-delay:.24s}
.rv.d3{transition-delay:.36s}
.rv.d4{transition-delay:.48s}
.rv.d5{transition-delay:.6s}

/* ============ LOGO ============ */
.logo-img{display:block;width:auto;height:auto}
.nav-brand .logo-img{height:clamp(22px,2.3vw,30px)}

/* ============ PRELOADER ============ */
.pl{
  position:fixed;inset:0;background:var(--black);z-index:9999;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s var(--ease),visibility 1s;
}
.pl.gone{opacity:0;visibility:hidden;pointer-events:none}
.pl-inner{text-align:center}
.pl-logo{
  height:clamp(34px,7vw,52px);width:auto;margin:0 auto;
  opacity:0;animation:plMark 1s var(--ease) .1s forwards;
}
@keyframes plMark{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pl-line{width:0;height:1px;background:var(--off-ghost);margin:1.5rem auto 0;animation:plLine 1.1s var(--ease) .25s forwards}
@keyframes plLine{to{width:60px}}

/* ============ SCROLL PROGRESS ============ */
.sprog{
  position:fixed;left:24px;top:0;bottom:0;width:1px;
  background:var(--line);z-index:90;pointer-events:none;
}
.sprog-fill{
  position:absolute;top:0;left:0;width:100%;
  background:var(--purple);height:0%;
  transition:height .15s linear;
  box-shadow:0 0 12px rgba(139,43,226,.6);
}
@media(max-width:900px){.sprog{display:none}}

/* ============ NAV ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:clamp(16px,2.6vw,28px) 0;
  background:linear-gradient(to bottom,rgba(5,5,5,.92) 0%,rgba(5,5,5,.6) 55%,rgba(5,5,5,0) 100%);
  pointer-events:none;
}
/* la barra usa el mismo ancho máximo que el contenido de la página */
.nav-inner{
  width:100%;max-width:1440px;margin:0 auto;
  padding:0 clamp(24px,5vw,60px);
  display:flex;align-items:center;justify-content:space-between;
}
.nav-inner > *{pointer-events:auto}
.nav-brand{display:inline-flex;align-items:center;transition:opacity .3s var(--ease)}
.nav-brand:hover{opacity:.75}
.nav-right{display:flex;align-items:center;gap:clamp(1rem,2vw,1.8rem)}
.nav-links{display:flex;align-items:center;gap:2rem}
.nav-cta{
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--off);
  padding:.72rem 1.15rem;
  border:1px solid var(--off-ghost);
  white-space:nowrap;
  transition:border-color .4s var(--ease),background .4s var(--ease),color .4s var(--ease);
}
.nav-cta:hover{border-color:var(--purple);background:var(--purple);color:#fff}
@media(max-width:400px){.nav-cta{padding:.65rem .9rem;letter-spacing:.18em;font-size:.55rem}}
@media(max-width:768px){.nav-links{display:none}}
.nav-links a{
  font-family:var(--mono);font-size:.65rem;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--off);opacity:.6;
  transition:opacity .3s;
}
.nav-links a:hover{opacity:1}

/* ============ OPTION WHEEL ============ */
.ow{
  position:fixed;left:24px;top:50%;transform:translateY(-50%);
  z-index:800;width:150px;
  pointer-events:none;display:none;
  opacity:.5;
  transition:opacity .4s var(--ease);
}
.ow:hover{opacity:1}
/* el menú lateral solo aparece cuando sobra espacio real a la izquierda
   (antes entraba encima del número de Métricas en pantallas de 1200-1500px) */
@media(min-width:1600px) and (hover:hover){.ow{display:block}}
.ow-inner{position:relative;pointer-events:auto}
.ow-item{
  display:block;width:100%;text-align:left;
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--off-faint);
  padding:.5rem 0;
  cursor:pointer;
  background:none;border:none;
  transition:color .3s var(--ease),padding-left .3s var(--ease);
  position:relative;
}
.ow-item::before{
  content:"";
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:0;height:1px;background:var(--purple);
  transition:width .3s var(--ease);
}
.ow-item:hover{color:var(--off-dim);padding-left:.7rem}
.ow-item.active{color:var(--off);padding-left:1.2rem}
.ow-item.active::before{width:16px}

/* ============ LAYOUT ============ */
.wrap{width:100%;max-width:1440px;margin:0 auto;padding:0 clamp(24px,5vw,60px)}
.wrap-nar{max-width:880px;margin:0 auto;padding:0 clamp(24px,5vw,60px)}

section{position:relative}
.sec{padding:clamp(6rem,16vh,12rem) 0}

.chap{
  font-family:var(--mono);font-size:.62rem;
  letter-spacing:.32em;text-transform:uppercase;
  color:var(--off-faint);margin-bottom:2rem;
  display:flex;align-items:baseline;gap:1.2rem;
}
.chap .num{color:var(--off);font-weight:500}
.chap .rule{flex:1;height:1px;background:var(--line);max-width:200px}

.h-serif{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.4rem,7vw,5.5rem);
  line-height:.98;letter-spacing:-.03em;
  color:var(--off);text-wrap:balance;
}
.h-serif em{font-style:italic;color:var(--off)}

.h-lg{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2rem,5.4vw,4.4rem);
  line-height:1;letter-spacing:-.025em;
  color:var(--off);text-wrap:balance;
}
.h-lg em{font-style:italic}

.body-lg{
  font-family:var(--sans);font-weight:300;
  font-size:clamp(1rem,1.35vw,1.2rem);
  line-height:1.65;color:var(--off-dim);
  max-width:52ch;
}
.body{
  font-family:var(--sans);font-weight:400;
  font-size:.94rem;line-height:1.75;
  color:var(--off-dim);max-width:54ch;
}

.eyebrow{
  font-family:var(--mono);font-size:.62rem;
  letter-spacing:.32em;text-transform:uppercase;
  color:var(--off-faint);
  display:inline-flex;align-items:center;gap:.6rem;
}
.eyebrow .dot{
  width:5px;height:5px;border-radius:50%;background:var(--purple);
  box-shadow:0 0 12px rgba(139,43,226,.7);
}

/* ============ PLACEHOLDER (componente reutilizable) ============ */
.ph-box{
  border:1px dashed var(--line-strong);
  background:
    linear-gradient(135deg,rgba(139,43,226,.04) 0%,transparent 60%),
    #0A0A0A;
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:clamp(1.8rem,4vw,2.8rem) clamp(1.2rem,3vw,2rem);
  gap:.9rem;
  transition:border-color .4s var(--ease);
  overflow:hidden;
}
.ph-box::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(to right,rgba(245,241,234,.04) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(245,241,234,.04) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
}
.ph-box:hover{border-color:var(--purple-soft)}
.ph-tag{
  position:relative;z-index:1;
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:var(--mono);font-size:.52rem;font-weight:500;
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--off-faint);
  padding:4px 10px;
  border:1px solid var(--line-strong);
}
.ph-tag::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:var(--purple);
  box-shadow:0 0 8px rgba(139,43,226,.7);
}
.ph-title{
  position:relative;z-index:1;
  font-family:var(--serif);font-style:italic;
  font-size:1.1rem;line-height:1.3;
  color:var(--off);
}
.ph-desc{
  position:relative;z-index:1;
  font-family:var(--sans);font-weight:300;
  font-size:.78rem;line-height:1.55;
  color:var(--off-faint);
  max-width:32ch;
}

/* ============ HERO (minimalista) ============ */
.hero{
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(90px,13vh,140px) 0 clamp(40px,7vh,80px);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%,rgba(139,43,226,.1) 0%,transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 75%,rgba(109,31,168,.07) 0%,transparent 60%);
}
.hero-inner{
  /* width:100% para que el titular arranque en el mismo margen que el
     resto de la página (antes se encogía y quedaba centrado por accidente) */
  width:100%;max-width:1440px;margin:0 auto;
  padding:0 clamp(24px,5vw,60px);
  position:relative;z-index:2;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.hero-head{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.8rem,9vw,8rem);
  line-height:.94;letter-spacing:-.04em;
  color:var(--off);
  max-width:15ch;
}
.hero-head em{font-style:italic}
.hero-head .ln{display:block;overflow:hidden}
.hero-head .ln > span{
  display:inline-block;
  transform:translateY(105%);
  transition:transform 1.2s var(--ease);
}
body.js-ready.hero-go .hero-head .ln > span{transform:none}
.hero-head .ln:nth-child(2) > span{transition-delay:.16s}
.hero-head .ln:nth-child(3) > span{transition-delay:.32s}
.hero-head .ln:nth-child(4) > span{transition-delay:.48s}

.hero-actions{
  margin-top:3rem;
  display:flex;flex-wrap:wrap;gap:1.4rem;align-items:center;
  opacity:0;transform:translateY(15px);
  transition:opacity 1s var(--ease) 1s,transform 1s var(--ease) 1s;
}
body.js-ready.hero-go .hero-actions{opacity:1;transform:none}

.hero-contact{
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--off-faint);
  transition:color .3s var(--ease);
}
.hero-contact:hover{color:var(--off)}

.hero-foot{
  display:flex;justify-content:space-between;align-items:end;gap:2rem;
  width:100%;max-width:1440px;margin:0 auto;
  padding:0 clamp(24px,5vw,60px);
  position:relative;z-index:2;
  flex-wrap:wrap;
}
.hero-sub{
  font-family:var(--sans);font-weight:300;
  font-size:clamp(.95rem,1.3vw,1.1rem);
  line-height:1.6;color:var(--off-dim);
  max-width:44ch;
  opacity:0;transform:translateY(20px);
  transition:opacity 1s var(--ease) 1s,transform 1s var(--ease) 1s;
}
body.js-ready.hero-go .hero-sub{opacity:1;transform:none}

.hero-meta{
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.3em;text-transform:uppercase;
  color:var(--off-faint);
  line-height:2;
  text-align:right;
  opacity:0;
  transition:opacity 1.2s var(--ease) 1.3s;
}
body.js-ready.hero-go .hero-meta{opacity:1}
@media(max-width:760px){.hero-meta{text-align:left}}

.hero-scroll{
  position:absolute;left:50%;bottom:clamp(20px,4vh,40px);
  transform:translateX(-50%);
  font-family:var(--mono);font-size:.55rem;
  letter-spacing:.4em;text-transform:uppercase;
  color:var(--off-faint);
  display:flex;flex-direction:column;align-items:center;gap:.8rem;
  opacity:0;
  transition:opacity 1.2s var(--ease) 1.7s;
  z-index:3;
}
body.js-ready.hero-go .hero-scroll{opacity:1}
.hero-scroll .bar{width:1px;height:38px;background:var(--off-ghost);position:relative;overflow:hidden}
.hero-scroll .bar::after{
  content:"";position:absolute;top:-100%;left:0;width:100%;height:100%;
  background:var(--off);
  animation:scrollBar 2.6s var(--ease) infinite;
}
@keyframes scrollBar{0%{top:-100%}60%{top:100%}100%{top:100%}}

/* ============ MANIFESTO ============ */
.manifesto{
  text-align:center;
  padding:clamp(8rem,20vh,16rem) 0;
  border-top:1px solid var(--line);
}
.manifesto .h-lg{
  font-size:clamp(2.2rem,6.5vw,5.4rem);
  max-width:20ch;margin:0 auto;
}
.manifesto .h-lg em{color:var(--purple-soft)}

/* ============ PROBLEM ============ */
.problem-grid{
  display:grid;grid-template-columns:1fr;
  gap:0;margin-top:4rem;
  border-top:1px solid var(--line);
}
.prob{
  display:grid;grid-template-columns:120px 1fr;
  gap:2rem;align-items:baseline;
  padding:clamp(1.8rem,3.5vh,2.8rem) 0;
  border-bottom:1px solid var(--line);
  transition:padding .4s var(--ease);
}
.prob:hover{padding-left:1rem}
@media(max-width:640px){.prob{grid-template-columns:1fr;gap:.6rem}}
.prob-n{
  font-family:var(--mono);font-size:.62rem;
  letter-spacing:.2em;color:var(--off-faint);
}
.prob-t{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(1.4rem,3vw,2.2rem);
  line-height:1.15;letter-spacing:-.02em;
  color:var(--off);
}
.prob-t em{font-style:italic;color:var(--off-dim)}

/* ============ SYSTEMS ============ */
.sys-wrap{margin-top:4rem;border-top:1px solid var(--line)}
.sys-row{
  display:grid;
  grid-template-columns:60px 1fr 200px 1fr;
  gap:2rem;align-items:baseline;
  padding:clamp(2rem,4vh,3rem) 0;
  border-bottom:1px solid var(--line);
  position:relative;
  transition:padding .5s var(--ease);
}
.sys-row:hover{padding-left:1.5rem}
.sys-row:hover .sys-name em{color:var(--purple-soft)}
@media(max-width:1024px){
  .sys-row{grid-template-columns:50px 1fr;gap:1rem;row-gap:.8rem}
  .sys-row .sys-tag, .sys-row .sys-desc{grid-column:2/3}
}
.sys-n{
  font-family:var(--serif);font-style:italic;
  font-size:1.4rem;color:var(--off-faint);
  line-height:1;
}
.sys-name{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(1.3rem,2.4vw,1.8rem);
  line-height:1.1;letter-spacing:-.02em;
  color:var(--off);
}
.sys-name em{font-style:italic;transition:color .4s var(--ease)}
.sys-tag{
  font-family:var(--mono);font-size:.58rem;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--off-faint);
}
.sys-desc{
  font-family:var(--sans);font-weight:300;
  font-size:.9rem;line-height:1.6;
  color:var(--off-dim);max-width:36ch;
}

/* ============ MÉTRICAS ============ */
.metrics{
  padding:clamp(7rem,18vh,14rem) 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  position:relative;
  overflow:hidden;
  transition:background 1.4s var(--ease);
}
.metrics::before{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 50%,
    var(--metric-glow,rgba(201,58,56,.08)) 0%,transparent 70%);
  transition:background 1.4s var(--ease);
}
.metrics.is-verde{
  --metric-color:var(--verde);
  --metric-glow:rgba(76,175,125,.08);
  --metric-dot:var(--verde);
}
.metrics.is-rojo{
  --metric-color:var(--rojo);
  --metric-glow:rgba(201,58,56,.08);
  --metric-dot:var(--rojo);
}

.metrics-inner{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr;gap:clamp(3rem,6vw,5rem);
  align-items:center;
  max-width:1180px;margin:0 auto;
}
@media(min-width:900px){.metrics-inner{grid-template-columns:1.15fr .85fr}}

.metric-main{text-align:left}
.metric-label{
  font-family:var(--mono);font-size:.62rem;
  letter-spacing:.32em;text-transform:uppercase;
  color:var(--off-faint);
  margin-bottom:1.5rem;
  display:inline-flex;align-items:center;gap:.6rem;
}
.metric-label::before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:var(--metric-dot,var(--rojo));
  box-shadow:0 0 14px var(--metric-dot,var(--rojo));
  transition:all 1.4s var(--ease);
}

/* número grande + métricas al lado */
.metric-num{
  font-family:var(--serif);font-weight:400;font-style:italic;
  font-size:clamp(4rem,10vw,8.4rem);
  line-height:.85;letter-spacing:-.05em;
  color:var(--metric-color,var(--rojo));
  font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;
  gap:.02em;
  transition:color 1.4s var(--ease),text-shadow 1.4s var(--ease);
  text-shadow:0 0 60px var(--metric-glow,rgba(201,58,56,.3));
}
.metric-num .sign{
  font-size:.45em;font-weight:400;
  line-height:1;
  align-self:flex-start;
  margin-top:.15em;
  opacity:.7;
}
.metric-num .suf{
  font-size:.46em;font-weight:400;
  line-height:1;
  opacity:.9;
}

.metric-flags{
  display:flex;flex-wrap:wrap;align-items:center;gap:.55rem;
  margin-top:1.8rem;
  font-family:var(--mono);font-size:.55rem;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--off-faint);
}
.metric-flags .sep{color:var(--off-ghost)}

.metric-caption{
  font-family:var(--mono);font-size:.66rem;
  letter-spacing:.35em;text-transform:uppercase;
  color:var(--off-faint);
  margin:1.6rem 0 .7rem;
}

.metric-note{
  font-family:var(--sans);font-weight:300;
  font-size:clamp(.9rem,1.2vw,1rem);
  line-height:1.65;color:var(--off-dim);
  max-width:46ch;
}
.metric-note b{color:var(--off);font-weight:400}

/* captura real del panel */
.metric-evidence{width:100%}
.shot-frame{
  position:relative;
  width:100%;max-width:330px;
  margin:0 auto;
  padding:9px;
  border:1px solid var(--line-strong);
  background:#0A0A0A;
  box-shadow:0 40px 90px -50px rgba(139,43,226,.55);
  transition:border-color .5s var(--ease),transform .6s var(--ease);
}
.shot-frame:hover{border-color:var(--purple-soft);transform:translateY(-4px)}
.shot-frame img{display:block;width:100%;height:auto}
.shot-cap{
  margin:1.1rem auto 0;
  text-align:center;
  font-family:var(--mono);font-size:.53rem;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--off-faint);
  max-width:38ch;
}
.shot-cap a{
  color:var(--off-dim);
  border-bottom:1px solid var(--line-strong);
  padding-bottom:1px;
  transition:color .3s var(--ease);
}
.shot-cap a:hover{color:var(--off)}

/* ============ FORM ============ */
.form-section{
  padding:clamp(6rem,14vh,10rem) 0;
  border-top:1px solid var(--line);
}
.form-inner{max-width:640px;margin:0 auto}
.form-head{text-align:center;margin-bottom:3rem}
.form-head h2{margin:1.2rem auto 0;max-width:16ch}
.form-fields{display:grid;grid-template-columns:1fr;gap:1.6rem;margin-bottom:2.5rem}
@media(min-width:640px){
  .form-fields{grid-template-columns:1fr 1fr;column-gap:2rem;row-gap:1.8rem}
  .form-field.full{grid-column:1/-1}
}
.form-field{display:flex;flex-direction:column;gap:.4rem;position:relative}
.form-field label{
  font-family:var(--mono);font-size:.55rem;
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--off-faint);
}
.form-field input,
.form-field textarea{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--line-strong);
  padding:.7rem 0;
  color:var(--off);
  font-family:var(--serif);font-style:italic;
  font-size:1.05rem;letter-spacing:-.01em;
  transition:border-color .3s var(--ease);
  outline:none;resize:vertical;
}
.form-field textarea{min-height:60px;font-family:var(--sans);font-style:normal;font-size:.95rem}
.form-field input::placeholder,
.form-field textarea::placeholder{
  color:var(--off-faint);
  font-family:var(--sans);font-style:normal;
  font-weight:300;font-size:.85rem;
  letter-spacing:0;
}
.form-field input:focus,
.form-field textarea:focus{border-bottom-color:var(--purple)}
.form-field input.error,
.form-field textarea.error{border-bottom-color:var(--rojo)}
.form-field .form-error{
  font-family:var(--mono);font-size:.55rem;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--rojo);
  margin-top:.3rem;
  display:none;
}
.form-field.has-error .form-error{display:block}

.form-submit{display:flex;justify-content:center;margin-top:1rem}
.form-btn{
  display:inline-flex;align-items:center;gap:1rem;
  font-family:var(--mono);font-size:.7rem;
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--off);
  padding:1.4rem 2.4rem;
  border:1px solid var(--off-ghost);
  position:relative;overflow:hidden;
  transition:border-color .4s var(--ease),color .4s var(--ease);
  background:none;cursor:pointer;
}
.form-btn::before{
  content:"";position:absolute;inset:0;
  background:var(--purple);
  transform:translateY(101%);
  transition:transform .6s var(--ease);
  z-index:-1;
}
.form-btn > *{position:relative;z-index:1}
.form-btn:hover{border-color:var(--purple);color:#fff}
.form-btn:hover::before{transform:translateY(0)}
.form-btn span.arr{
  font-family:var(--sans);font-size:1.1rem;
  transition:transform .4s var(--ease);
}
.form-btn:hover span.arr{transform:translateX(4px)}

.form-note{
  text-align:center;
  font-family:var(--mono);font-size:.55rem;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--off-faint);
  margin-top:1.5rem;
  line-height:2;
}
.form-note a{color:var(--off-dim);border-bottom:1px solid var(--line-strong);padding-bottom:2px;transition:color .3s;text-transform:none;letter-spacing:.08em}
.form-note a:hover{color:var(--off)}

.form-success{display:none;text-align:center;padding:2rem 0}
.form-success.show{display:block}
.form-success .check{
  width:56px;height:56px;
  border-radius:50%;
  border:1px solid var(--off-ghost);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 1.8rem;
  color:var(--verde);
  font-family:var(--serif);font-style:italic;
  font-size:1.5rem;
}
.form-success h3{
  font-family:var(--serif);font-style:italic;
  font-size:1.6rem;font-weight:400;
  color:var(--off);
  margin-bottom:.8rem;
  letter-spacing:-.02em;
}
.form-success p{
  font-family:var(--sans);font-weight:300;
  font-size:.9rem;line-height:1.65;
  color:var(--off-dim);
  max-width:44ch;margin:0 auto 2rem;
}
.form-success-actions{
  display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;
}

/* ============ FAQ ============ */
.faq-list{margin-top:3.5rem;border-top:1px solid var(--line)}
.faq-i{border-bottom:1px solid var(--line)}
.faq-q{
  display:flex;justify-content:space-between;gap:2rem;
  padding:clamp(1.5rem,3vh,2.2rem) 0;
  width:100%;text-align:left;
  font-family:var(--serif);font-weight:400;
  font-size:clamp(1.1rem,2vw,1.5rem);
  line-height:1.25;letter-spacing:-.015em;
  color:var(--off);
  transition:color .3s;
}
.faq-q:hover{color:var(--purple-soft)}
.faq-i.open .faq-q{color:var(--off)}
.faq-mark{
  font-family:var(--serif);font-style:italic;
  font-size:1.4rem;color:var(--off-faint);
  flex-shrink:0;transition:transform .4s var(--ease),color .3s;
  line-height:1;
}
.faq-i.open .faq-mark{transform:rotate(45deg);color:var(--purple-soft)}
.faq-a{
  max-height:0;overflow:hidden;
  transition:max-height .6s var(--ease),padding .6s var(--ease);
}
.faq-i.open .faq-a{
  max-height:420px;
  padding-bottom:clamp(1.5rem,3vh,2.2rem);
}
.faq-a p{
  font-family:var(--sans);font-weight:300;
  font-size:.95rem;line-height:1.75;
  color:var(--off-dim);max-width:58ch;
}

/* ============ FINAL ============ */
.final{
  text-align:center;
  padding:clamp(8rem,18vh,14rem) 0 clamp(6rem,12vh,10rem);
  border-top:1px solid var(--line);
  position:relative;overflow:hidden;
}
.final::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 50% 100%,rgba(139,43,226,.1) 0%,transparent 65%);
}
.final-inner{position:relative;z-index:2}
.final .h-serif{max-width:18ch;margin:0 auto}
.final .h-serif em{color:var(--purple-soft)}
.final-sub{
  margin:2.5rem auto 3.5rem;
  font-family:var(--sans);font-weight:300;
  font-size:clamp(.95rem,1.3vw,1.1rem);
  line-height:1.65;color:var(--off-dim);
  max-width:46ch;
}
.final-cta{
  display:inline-flex;align-items:center;gap:1rem;
  font-family:var(--mono);font-size:.7rem;
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--off);
  padding:1.4rem 2.4rem;
  border:1px solid var(--off-ghost);
  position:relative;overflow:hidden;
  transition:border-color .4s var(--ease),color .4s var(--ease);
}
.final-cta::before{
  content:"";position:absolute;inset:0;
  background:var(--purple);
  transform:translateY(101%);
  transition:transform .6s var(--ease);
  z-index:-1;
}
.final-cta > *{position:relative;z-index:1}
.final-cta:hover{border-color:var(--purple);color:#fff}
.final-cta:hover::before{transform:translateY(0)}
.final-cta span.arr{
  font-family:var(--sans);font-size:1.1rem;
  transition:transform .4s var(--ease);
}
.final-cta:hover span.arr{transform:translateX(4px)}
.final-mail{
  margin-top:2rem;
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--off-faint);
}
.final-mail a{color:var(--off-dim);border-bottom:1px solid var(--line-strong);padding-bottom:2px;transition:color .3s;text-transform:none;letter-spacing:.08em}
.final-mail a:hover{color:var(--off)}
.final-cap{
  margin-top:1.4rem;
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.3em;text-transform:uppercase;
  color:var(--off-faint);
}

/* ============ FOOTER ============ */
.footer{
  padding:clamp(3rem,6vh,5rem) 0 clamp(2rem,4vh,3rem);
  border-top:1px solid var(--line);
}
.foot-grid{
  display:grid;grid-template-columns:2fr 1fr 1fr;
  gap:3rem;
  padding-bottom:3.5rem;
  border-bottom:1px solid var(--line);
}
@media(max-width:900px){.foot-grid{grid-template-columns:1fr 1fr;gap:2rem}}
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
.foot-col h5{
  font-family:var(--mono);font-size:.58rem;
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--off-faint);font-weight:500;
  margin-bottom:1.4rem;
}
.foot-col a{
  display:block;font-family:var(--sans);font-weight:300;
  font-size:.85rem;color:var(--off-dim);
  padding:.35rem 0;transition:color .3s;
  word-break:break-word;
}
.foot-col a:hover{color:var(--off)}
.foot-brand{display:inline-block;margin-bottom:1.2rem;transition:opacity .3s}
.foot-brand:hover{opacity:.75}
.foot-brand .logo-img{height:clamp(28px,3.4vw,38px)}
.foot-tag{
  font-family:var(--sans);font-weight:300;
  font-size:.85rem;line-height:1.65;
  color:var(--off-dim);max-width:32ch;
}
.foot-bottom{
  display:flex;justify-content:space-between;gap:2rem;
  flex-wrap:wrap;
  padding-top:2rem;
  font-family:var(--mono);font-size:.58rem;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--off-faint);
}
.foot-bottom a:hover{color:var(--off-dim)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.05s!important;
    scroll-behavior:auto!important;
  }
  body.js-ready .rv{opacity:1;transform:none;transition:none}
  .hero-head .ln > span{transform:none!important}
  .hero-sub,.hero-actions,.hero-meta,.hero-scroll{opacity:1!important;transform:none!important}
}

}

/* ============================================================
   SCROLL PROGRESS
   ============================================================ */
function ScrollProgress(){
  var ref = useRef(null);
  useEffect(function(){
    var el = ref.current;
    if(!el) return;
    var raf = null;
    function update(){
      var docH = document.documentElement.scrollHeight - window.innerHeight;
      var pct = docH > 0 ? (window.scrollY / docH) * 100 : 0;
      el.style.height = Math.min(100, Math.max(0, pct)) + '%';
      raf = null;
    }
    function onScroll(){
      if(raf) return;
      raf = requestAnimationFrame(update);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    update();
    return function(){
      window.removeEventListener('scroll', onScroll);
      if(raf) cancelAnimationFrame(raf);
    };
  }, []);
  return h('div', { className: 'sprog' },
    h('div', { className: 'sprog-fill', ref: ref })
  );
}

/* ============================================================
   OPTION WHEEL
   ============================================================ */
function OptionWheel(){
  var SECTIONS = [
    { label: 'Inicio',     id: 'inicio' },
    { label: 'Manifiesto', id: 'manifiesto' },
    { label: 'Problema',   id: 'problema' },
    { label: 'Sistema',    id: 'sistema' },
    { label: 'Proceso',    id: 'proceso' },
    { label: 'Métricas',   id: 'metricas' },
    { label: 'Preguntas',  id: 'faq' },
    { label: 'Contacto',   id: 'contacto' }
  ];

  var activeS = useState(0);
  var active = activeS[0], setActive = activeS[1];

  useEffect(function(){
    function onScroll(){
      var mid = window.scrollY + window.innerHeight * 0.4;
      var bestIdx = 0;
      var bestDist = Infinity;
      SECTIONS.forEach(function(sec, i){
        var el = document.getElementById(sec.id);
        if(!el) return;
        var rect = el.getBoundingClientRect();
        var top = rect.top + window.scrollY;
        var bottom = top + rect.height;
        if(mid >= top && mid <= bottom){
          bestIdx = i; bestDist = 0;
        } else {
          var d = Math.min(Math.abs(mid - top), Math.abs(mid - bottom));
          if(d < bestDist && d < window.innerHeight){
            bestDist = d; bestIdx = i;
          }
        }
      });
      setActive(bestIdx);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return function(){ window.removeEventListener('scroll', onScroll); };
  }, []);

  function go(id){
    var el = document.getElementById(id);
    if(!el) return;
    var top = el.getBoundingClientRect().top + window.pageYOffset - 60;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }

  return h('aside', { className: 'ow' },
    h('div', { className: 'ow-inner' },
      SECTIONS.map(function(sec, i){
        return h('button', {
          key: sec.id,
          type: 'button',
          className: 'ow-item' + (active === i ? ' active' : ''),
          onClick: function(){ go(sec.id); }
        }, sec.label);
      })
    )
  );
}

/* ============================================================
   METRICS — número +130K + captura real del panel
   ============================================================ */
function Metrics(){
  var sectionRef = useRef(null);
  var stateS = useState('is-rojo');
  var stateClass = stateS[0], setStateClass = stateS[1];
  var coloredRef = useRef(false);

  useEffect(function(){
    if(!sectionRef.current) return;
    var el = sectionRef.current;

    function goVerde(){
      if(coloredRef.current) return;
      coloredRef.current = true;
      setStateClass('is-verde');
    }

    /* la sección pasa de rojo a verde cuando entra en pantalla
       (con temporizador de respaldo para que nunca se quede en rojo) */
    var fallback = setTimeout(goVerde, 6000);

    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.intersectionRatio > 0.45) goVerde();
        });
      }, { threshold: [0.3, 0.5, 0.7] });
      io.observe(el);
      return function(){ io.disconnect(); clearTimeout(fallback); };
    } else {
      function onScroll(){
        var rect = el.getBoundingClientRect();
        if(rect.top < window.innerHeight * 0.6) goVerde();
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      return function(){ window.removeEventListener('scroll', onScroll); clearTimeout(fallback); };
    }
  }, []);

  return h('section', {
    className: 'metrics ' + stateClass,
    ref: sectionRef,
    id: 'metricas'
  },
    h('div', { className: 'wrap' },
      h('div', { className: 'chap rv', style: { justifyContent: 'center' } },
        h('span', { className: 'num' }, '§ IV'),
        h('span', null, 'Métricas'),
        h('span', { className: 'rule' })
      ),
      h('div', { className: 'metrics-inner' },
        h('div', { className: 'metric-main' },
          h('span', { className: 'metric-label rv' }, 'Métricas del mes'),
          h('div', { className: 'metric-num rv d1' },
            h('span', { className: 'sign' }, '+'),
            h('span', null, CONFIG.metricTarget + CONFIG.metricSuffix)
          ),
          h('p', { className: 'metric-caption rv d2' }, 'Visualizaciones · en un mes'),
          h('p', { className: 'metric-note rv d2' },
            'Datos reales de nuestra cuenta de Instagram, sin publicidad pagada: ',
            h('b', null, 'todo orgánico.'),
            ' Es la referencia de lo que produce el sistema cuando se ejecuta con criterio. Los números cambian según el negocio y el mes.'
          ),
          h('p', { className: 'metric-flags rv d3' },
            h('span', null, 'Sin publicidad pagada'),
            h('span', { className: 'sep' }, '·'),
            h('span', null, 'Sin comprar seguidores'),
            h('span', { className: 'sep' }, '·'),
            h('span', null, 'Sin bots')
          )
        ),
        h('div', { className: 'metric-evidence rv d2' },
          h('div', { className: 'shot-frame' },
            h('img', {
              src: SHOT_SRC,
              alt: 'Panel de estadísticas de Instagram: 126.656 visualizaciones, +543 seguidores netos, 92.119 espectadores, 125 mil en Reels y 1,7 mil en Historias en los últimos 30 días.',
              loading: 'lazy',
              decoding: 'async'
            })
          ),
          h('p', { className: 'shot-cap' },
            'Captura del panel de Instagram · ',
            h('a', { href: IG, target: '_blank', rel: 'noopener noreferrer' }, '@' + CONFIG.instagram)
          )
        )
      )
    )
  );
}

/* ============================================================
   FORM
   ============================================================ */
function Form(){
  var formRef = useRef(null);
  var successS = useState(false);
  var success = successS[0], setSuccess = successS[1];
  var waLinkS = useState(WA);
  var waLink = waLinkS[0], setWaLink = waLinkS[1];

  function validatePhone(v){ return v.replace(/\D/g, '').length >= 7; }
  function validateSocial(v){
    if(!v) return false;
    return /^@[\w.\-]{2,}$/.test(v) || /^https?:\/\/.+/.test(v) || /^[\w\-]+\.[\w.\-]+$/.test(v);
  }

  function validateField(input){
    var field = input.closest('.form-field');
    var val = input.value.trim();
    var name = input.name;
    var ok = true;

    if(!val) ok = false;
    else if(name === 'name' && val.length < 2) ok = false;
    else if(name === 'brand' && val.length < 2) ok = false;
    else if(name === 'phone' && !validatePhone(val)) ok = false;
    else if(name === 'social' && !validateSocial(val)) ok = false;
    else if(name === 'improve' && val.length < 10) ok = false;

    field.classList.toggle('has-error', !ok);
    input.classList.toggle('error', !ok);
    return ok;
  }

  function handleSubmit(e){
    e.preventDefault();
    var form = formRef.current;
    if(!form) return;
    var inputs = form.querySelectorAll('input[required], textarea[required]');
    var ok = true;
    var firstInvalid = null;

    inputs.forEach(function(input){
      if(!validateField(input)){
        ok = false;
        if(!firstInvalid) firstInvalid = input;
      }
    });
    if(!ok){
      if(firstInvalid) firstInvalid.focus();
      return;
    }

    var data = {
      name: form.querySelector('[name="name"]').value.trim(),
      brand: form.querySelector('[name="brand"]').value.trim(),
      phone: form.querySelector('[name="phone"]').value.trim(),
      social: form.querySelector('[name="social"]').value.trim(),
      improve: form.querySelector('[name="improve"]').value.trim()
    };

    var lines = [
      'Hola KREO VIRAL. Quiero hablar sobre mi negocio.',
      '',
      'Nombre: ' + data.name,
      'Negocio: ' + data.brand,
      'WhatsApp: ' + data.phone,
      'Instagram/Web: ' + data.social,
      '',
      'Quiero mejorar: ' + data.improve
    ];

    var msg = encodeURIComponent(lines.join('\n'));
    var url = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + msg;
    setWaLink(url);

    try { window.open(url, '_blank', 'noopener'); } catch(err){}

    setSuccess(true);
  }

  function handleInput(e){
    var input = e.target;
    var field = input.closest('.form-field');
    if(field && field.classList.contains('has-error')){
      validateField(input);
    }
  }

  function handleBlur(e){
    validateField(e.target);
  }

  return h('section', { className: 'form-section', id: 'contacto' },
    h('div', { className: 'wrap-nar' },
      h('div', { className: 'form-inner' },
        h('div', { className: 'form-head rv' },
          h('span', { className: 'eyebrow', style: { justifyContent: 'center', display: 'inline-flex' } },
            h('span', { className: 'dot' }),
            'Hablemos'
          ),
          h('h2', { className: 'h-lg' },
            'Cuéntanos ',
            h('em', null, 'dónde estás.')
          )
        ),
        !success && h('form', {
          ref: formRef,
          onSubmit: handleSubmit,
          noValidate: true,
          className: 'form-fields'
        },
          h('div', { className: 'form-field' },
            h('label', { htmlFor: 'f-name' }, 'Nombre *'),
            h('input', {
              type: 'text', id: 'f-name', name: 'name',
              placeholder: 'Cómo te llamas', autoComplete: 'name',
              onInput: handleInput, onBlur: handleBlur,
              required: true, minLength: 2
            }),
            h('span', { className: 'form-error' }, 'Ingresa tu nombre')
          ),
          h('div', { className: 'form-field' },
            h('label', { htmlFor: 'f-brand' }, 'Negocio *'),
            h('input', {
              type: 'text', id: 'f-brand', name: 'brand',
              placeholder: 'Nombre de tu negocio',
              onInput: handleInput, onBlur: handleBlur,
              required: true, minLength: 2
            }),
            h('span', { className: 'form-error' }, 'Ingresa el nombre')
          ),
          h('div', { className: 'form-field' },
            h('label', { htmlFor: 'f-phone' }, 'WhatsApp *'),
            h('input', {
              type: 'tel', id: 'f-phone', name: 'phone',
              placeholder: 'Con código de país', autoComplete: 'tel',
              onInput: handleInput, onBlur: handleBlur,
              required: true, inputMode: 'tel'
            }),
            h('span', { className: 'form-error' }, 'Ingresa un WhatsApp válido')
          ),
          h('div', { className: 'form-field' },
            h('label', { htmlFor: 'f-social' }, 'Instagram o web *'),
            h('input', {
              type: 'text', id: 'f-social', name: 'social',
              placeholder: '@usuario o URL',
              onInput: handleInput, onBlur: handleBlur,
              required: true
            }),
            h('span', { className: 'form-error' }, 'Ingresa tu usuario o sitio')
          ),
          h('div', { className: 'form-field full' },
            h('label', { htmlFor: 'f-improve' }, '¿Qué quieres mejorar? *'),
            h('textarea', {
              id: 'f-improve', name: 'improve',
              placeholder: 'En una línea.',
              onInput: handleInput, onBlur: handleBlur,
              required: true, minLength: 10
            }),
            h('span', { className: 'form-error' }, 'Cuéntanos brevemente')
          ),
          h('div', { className: 'form-submit', style: { gridColumn: '1/-1' } },
            h('button', { type: 'submit', className: 'form-btn' },
              h('span', null, 'Hablemos'),
              h('span', { className: 'arr' }, '→')
            )
          ),
          h('p', { className: 'form-note', style: { gridColumn: '1/-1' } },
            'Respondemos personalmente.',
            h('br'),
            'También puedes escribirnos a ',
            h('a', { href: 'mailto:' + CONFIG.email }, CONFIG.email)
          )
        ),
        success && h('div', { className: 'form-success show' },
          h('div', { className: 'check' }, '✓'),
          h('h3', null, 'Ya preparamos tu mensaje.'),
          h('p', null, 'Se abrirá WhatsApp para que puedas enviárnoslo directamente. Si no se abre, usa el botón de abajo.'),
          h('div', { className: 'form-success-actions' },
            h('a', {
              href: waLink,
              target: '_blank',
              rel: 'noopener noreferrer',
              className: 'form-btn'
            },
              h('span', null, 'Abrir WhatsApp'),
              h('span', { className: 'arr' }, '→')
            )
          )
        )
      )
    )
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  var loadedS = useState(false);
  var loaded = loadedS[0], setLoaded = loadedS[1];

  useEffect(function(){
    if(!loaded) return;
    document.body.classList.add('js-ready');

    var els = document.querySelectorAll('.rv');
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          e.target.classList.add('visible');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -80px 0px' });
    els.forEach(function(el){ io.observe(el); });

    var safety = setTimeout(function(){
      els.forEach(function(el){ el.classList.add('visible'); });
    }, 2000);

    return function(){ io.disconnect(); clearTimeout(safety); };
  }, [loaded]);

  var handleDone = useCallback(function(){ setLoaded(true); }, []);

  if(!loaded){
    return h(Preloader, { onDone: handleDone });
  }

  return h(React.Fragment, null,
    h(ScrollProgress),
    h(OptionWheel),
    h(Nav),
    h('main', null,
      h(Hero),
      h(Manifesto),
      h(Problem),
      h(Systems),
      h(Process),
      h(Metrics),
      h(FAQ),
      h(Final),
      h(Form)
    ),
    h(Footer)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

})();
